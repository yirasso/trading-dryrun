name: dry-run paper trader

# Lisbon 11:00-21:10 on weekdays (Lisbon = UTC in winter; in summer this runs an hour later
# in Lisbon time, still covering the whole NYSE session). The runner itself decides what to
# do from the New York clock, so an extra or late run is harmless.
on:
  schedule:
    - cron: "5,35 11-20 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dryrun
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the day-trader-skill tools (pinned)
        run: |
          git clone --quiet https://github.com/Jakeschincariol/day-trader-skill.git skills
          git -C skills checkout --quiet 3d0f4ef

      - name: Run
        run: python -W ignore runner.py

      - name: Save state, ledger and balance
        if: always()
        run: |
          git config user.name "dry-run bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A ledger.json BALANCE.md journal trader
          git diff --cached --quiet && exit 0
          git commit -m "dry run $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
